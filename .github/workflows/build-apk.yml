name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK with EAS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive

      - name: Download APK and upload as artifact
        run: |
          URL=$(eas build:list --platform android --status finished --limit 1 --json --non-interactive | python3 -c "import sys,json; builds=json.load(sys.stdin); print(builds[0]['artifacts']['buildUrl'])")
          curl -L "$URL" -o ioniq5-charge.apk
          echo "APK downloaded: $(ls -lh ioniq5-charge.apk)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ioniq5-charge-apk
          path: ioniq5-charge.apk
          retention-days: 30
